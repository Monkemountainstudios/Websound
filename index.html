<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonkeMountainStudios Atmosphere</title>
  <link rel="stylesheet" href="style.css?v=2.0">
</head>
<body>
  <main class="atmosphere-panel" aria-label="MonkeMountainStudios Atmosphere controls">
    <div class="panel-heading">
      <span>Atmosphere</span>
      <span id="statusLed" class="status-led" aria-hidden="true"></span>
    </div>

    <div class="button-row" role="group" aria-label="Atmosphere">
      <button id="onButton" class="control-button" type="button" aria-pressed="false">ENGAGE</button>
      <button id="offButton" class="control-button active" type="button" aria-pressed="true">DISENGAGE</button>
    </div>

    <div id="evolutionLabel" class="control-label">Evolution</div>

    <div class="button-row evolution-row" role="group" aria-label="Evolution">
      <button id="sporadicButton" class="control-button active" type="button" aria-pressed="true">SPORADIC</button>
      <button id="frequentButton" class="control-button" type="button" aria-pressed="false">FREQUENT</button>
    </div>

    <div class="control-label">Performance</div>

    <div class="button-row" role="group" aria-label="Performance">
      <button id="normalButton" class="control-button active" type="button" aria-pressed="true">NORMAL</button>
      <button id="glacialButton" class="control-button" type="button" aria-pressed="false">GLACIAL</button>
    </div>

    <div id="modeHelp" class="mode-help" aria-live="polite">
      If you experience clicks, pops or other audio glitches, engage Glacial Mode.
    </div>

    <div class="copyright">All Audio &copy; 2026 Sonic Onion</div>
  </main>

  <script src="generator.js?v=2.1"></script>
</body>
</html>
